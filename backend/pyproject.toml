[project]
name = "links-to-epub-backend"
version = "0.1.0"
description = "Telegram bot backend for converting links to EPUB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-telegram-bot[webhooks]>=21.0",
    "httpx>=0.28.0",
    "arq>=0.26.0",
    "readability-lxml>=0.8.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "ebooklib>=0.18",
    "Pillow>=11.0.0",
    "resend>=2.0.0",
    "prometheus-client>=0.21.0",
    "playwright>=1.40.0",
    "markdown>=3.5.0",
    "mammoth>=1.6.0",
    "logs-flow @ git+https://github.com/v-v-l/logs-flow.git#subdirectory=packages/python",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "fakeredis[aioredis]>=2.21.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
