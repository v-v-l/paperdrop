name: paperdrop

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_IP_ADDRESS: "0.0.0.0"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081 2>&1 | grep -q '404' && exit 0 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8040}:${APP_PORT:-8040}"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
    volumes:
      - epub_temp:/tmp/links_to_epub
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro

  worker:
    build: ./backend
    restart: unless-stopped
    command: uv run arq app.worker.WorkerSettings
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
    volumes:
      - epub_temp:/tmp/links_to_epub
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro

  migrate:
    build: ./backend
    command: uv run alembic upgrade head
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  landing:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro

volumes:
  redis_data:
  epub_temp:
  telegram_bot_api_data:
