name: paperdrop

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8040}:${APP_PORT:-8040}"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - epub_temp:/tmp/links_to_epub

  worker:
    build: ./backend
    restart: unless-stopped
    command: uv run arq app.worker.WorkerSettings
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - epub_temp:/tmp/links_to_epub

  migrate:
    build: ./backend
    command: uv run alembic upgrade head
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  landing:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro

volumes:
  redis_data:
  epub_temp:
